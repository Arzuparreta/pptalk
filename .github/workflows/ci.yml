name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install -y
          libdbus-1-dev pkg-config
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p pptalk-cli -p pptalk-node --locked
      - run: python3 scripts/smoke-e2e.py
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - run: cmake -S apps/desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/desktop
      - name: Smoke-test desktop startup
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 3s ./build/desktop/pptalk-desktop
          status="$?"
          set -e
          test "$status" -eq 124

  desktop-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install GStreamer 1.28 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/1.28.5/msvc/gstreamer-1.0-msvc-x86_64-1.28.5.exe" -OutFile "$env:RUNNER_TEMP\gstreamer.exe"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\gstreamer.exe" -ArgumentList '/VERYSILENT','/NORESTART','/CURRENTUSER','/TYPE=devel','/DIR=C:\gstreamer'
          if (-not (Test-Path "C:\gstreamer\bin\gst-inspect-1.0.exe")) {
            throw "GStreamer did not install in the requested directory"
          }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer" | Out-File -Append -FilePath $env:GITHUB_ENV
          "PATH=C:\gstreamer\bin;$env:PATH" | Out-File -Append -FilePath $env:GITHUB_ENV
          "C:\gstreamer\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
          & "C:\gstreamer\bin\gst-inspect-1.0.exe" opusenc | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "GStreamer could not load the Opus encoder" }
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build -p pptalk-cli -p pptalk-node --locked
      - name: Run end-to-end smoke on Windows
        run: >-
          python scripts/smoke-e2e.py
          --binary target/debug/pptalk-cli.exe
          --node-binary target/debug/pptalk-node.exe
      - run: cmake -S apps/desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl
      - run: cmake --build build/desktop
      - name: Smoke-test Qt desktop with its real daemon
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PPTALK_CLI = (Resolve-Path "target/debug/pptalk-cli.exe").Path
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "pptalk-desktop-appdata"
          foreach ($RelativeDir in @("pptalk", "pptalk/pptalk")) {
            $ProfileDir = Join-Path $env:APPDATA $RelativeDir
            New-Item -ItemType Directory -Force -Path $ProfileDir | Out-Null
            & $env:PPTALK_CLI init --profile "$ProfileDir/profile.json" --name "CI Windows"
            if ($LASTEXITCODE -ne 0) { throw "Could not create the desktop smoke profile" }
          }
          $Process = Start-Process -PassThru -FilePath "build/desktop/pptalk-desktop.exe"
          Start-Sleep -Seconds 8
          if ($Process.HasExited) {
            throw "pptalk-desktop exited during startup with code $($Process.ExitCode)"
          }
          $Child = Get-CimInstance Win32_Process |
              Where-Object { $_.ParentProcessId -eq $Process.Id -and $_.Name -eq "pptalk-cli.exe" }
          if (-not $Child) { throw "pptalk-desktop did not start its local daemon" }
          Stop-Process -Id $Process.Id
          $Child | ForEach-Object { Stop-Process -Id $_.ProcessId -ErrorAction SilentlyContinue }
