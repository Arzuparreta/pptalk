name: release

# Releases are driven by workspace.package.version in Cargo.toml. When ci
# succeeds on main and that version has no matching tag yet, this workflow
# builds the artifacts and publishes them under a v<version> tag it creates.
# Pushing a v* tag by hand still works and takes the same path.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Resolve the version to publish
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          tag="v${version}"

          if [ "${EVENT_NAME}" = 'push' ]; then
            # A hand-pushed tag must agree with the manifest, so the version a
            # build reports is always the version it was released under.
            if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
              printf 'tag %s does not match workspace.package.version %s\n' \
                "${GITHUB_REF_NAME}" "${version}" >&2
              exit 1
            fi
            sha="${GITHUB_SHA}"
            publish=true
          else
            sha="${HEAD_SHA}"
            if gh release view "${tag}" >/dev/null 2>&1 \
              || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              printf '%s is already released; bump workspace.package.version to publish\n' "${tag}"
              publish=false
            else
              publish=true
            fi
          fi

          {
            printf 'publish=%s\n' "${publish}"
            printf 'tag=%s\n' "${tag}"
            printf 'sha=%s\n' "${sha}"
          } >> "${GITHUB_OUTPUT}"
          printf '::notice::%s publish=%s\n' "${tag}" "${publish}"

  linux:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install -y
          libdbus-1-dev pkg-config
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
          gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-tools
      - name: Install AppImage tools
        shell: bash
        run: |
          curl -fL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -o "$RUNNER_TEMP/linuxdeploy"
          curl -fL "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" -o "$RUNNER_TEMP/linuxdeploy-plugin-qt"
          chmod +x "$RUNNER_TEMP/linuxdeploy" "$RUNNER_TEMP/linuxdeploy-plugin-qt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bash scripts/package-linux.sh "${RELEASE_TAG}"
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          PPTALK_ARTIFACT_ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Smoke-test AppImage
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          artifact="build/pptalk-${RELEASE_TAG}-linux-x86_64.AppImage"
          chmod +x "$artifact"
          "$artifact" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/pptalk-desktop
          test -x squashfs-root/usr/bin/pptalk-cli
          set +e
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 5s "$artifact"
          status="$?"
          set -e
          test "$status" -eq 124
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            build/*.AppImage
            build/*.AppImage.zsync
          if-no-files-found: error

  windows:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
          tools: tools_ifw
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install GStreamer 1.28 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/1.28.5/msvc/gstreamer-1.0-msvc-x86_64-1.28.5.exe" -OutFile "$env:RUNNER_TEMP\gstreamer.exe"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\gstreamer.exe" -ArgumentList '/VERYSILENT','/NORESTART','/CURRENTUSER','/TYPE=devel','/DIR=C:\gstreamer'
          if (-not (Test-Path "C:\gstreamer\bin\gst-inspect-1.0.exe")) {
            throw "GStreamer did not install in the requested directory"
          }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer" | Out-File -Append -FilePath $env:GITHUB_ENV
          "PATH=C:\gstreamer\bin;$env:PATH" | Out-File -Append -FilePath $env:GITHUB_ENV
          "C:\gstreamer\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
          & "C:\gstreamer\bin\gst-inspect-1.0.exe" opusenc | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "GStreamer could not load the Opus encoder" }
      - shell: pwsh
        run: ./scripts/package-windows.ps1 -Version $env:RELEASE_TAG
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      - name: Smoke-test Windows installer and installed application
        shell: pwsh
        run: |
          $StageDir = "build/package-windows/pptalk"
          & "$StageDir/pptalk-cli.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "The staged CLI did not start" }
          $Installer = (Get-Item "build/pptalk-*-windows-x86_64.exe").FullName
          $InstallDir = Join-Path $env:RUNNER_TEMP "pptalk-installed"
          & $Installer --root $InstallDir --accept-licenses --accept-obligations `
              --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "The Windows installer failed" }
          $ProfileDir = Join-Path $env:RUNNER_TEMP "pptalk-installed-profile"
          New-Item -ItemType Directory -Force -Path $ProfileDir | Out-Null
          $env:PPTALK_PROFILE = Join-Path $ProfileDir "profile.json"
          & "$InstallDir/pptalk-cli.exe" init `
              --profile $env:PPTALK_PROFILE --name "CI Installed"
          if ($LASTEXITCODE -ne 0) { throw "The installed CLI could not create a profile" }
          $Process = Start-Process -PassThru -FilePath "$InstallDir/pptalk-desktop.exe"
          Start-Sleep -Seconds 8
          if ($Process.HasExited) {
            throw "pptalk-desktop exited during the startup smoke test with code $($Process.ExitCode)"
          }
          $Child = Get-CimInstance Win32_Process |
              Where-Object { $_.ParentProcessId -eq $Process.Id -and $_.Name -eq "pptalk-cli.exe" }
          if (-not $Child) { throw "The installed desktop did not start its local daemon" }
          Stop-Process -Id $Process.Id
          $Child | ForEach-Object { Stop-Process -Id $_.ProcessId -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/*.exe
          if-no-files-found: error

  publish:
    needs: [gate, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      # Creates the tag at the built commit when it does not exist yet, so a
      # failed build never leaves a tag behind with nothing released under it.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.gate.outputs.tag, '-') }}
