[package]
name = "pptalk-cli"
description = "Headless diagnostics and protocol CLI for pptalk"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
hex.workspace = true
pptalk-core = { path = "../../crates/core" }
pptalk-media = { path = "../../crates/media" }
pptalk-mls = { path = "../../crates/mls" }
pptalk-network = { path = "../../crates/network" }
pptalk-protocol = { path = "../../crates/protocol" }
pptalk-storage = { path = "../../crates/storage" }
qrcode.workspace = true
rand.workspace = true
reqwest.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[lints]
workspace = true
