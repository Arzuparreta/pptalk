[package]
name = "pptalk-distributed"
description = "Bounded Veilid DHT storage spike for opaque pptalk envelopes"
license = "MPL-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/Arzuparreta/pptalk"

[dependencies]
anyhow = "1.0.100"
blake3 = "1.8.2"
clap = { version = "4.5.50", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
veilid-core = { version = "0.5.7", default-features = false, features = ["default-tokio"] }
