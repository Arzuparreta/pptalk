[workspace]
resolver = "3"
members = [
  "apps/cli",
  "apps/node",
  "crates/core",
  "crates/media",
  "crates/mls",
  "crates/network",
  "crates/protocol",
  "crates/storage",
]
exclude = ["crates/distributed"]

[workspace.package]
# Source of truth for releases: pushing main with a new value here creates the
# matching v<version> tag and publishes its artifacts. See .github/workflows/release.yml.
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.91"
authors = ["pptalk contributors"]
repository = "https://github.com/Arzuparreta/pptalk"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
ashpd = { version = "0.11.0", default-features = false, features = ["tokio"] }
async-trait = "0.1.89"
axum = "0.8.8"
base64 = "0.22.1"
blake3 = "1.8.2"
bytes = "1.10.1"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
ciborium = "0.2.2"
clap = { version = "4.5.50", features = ["derive", "env"] }
directories = "6.0.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
futures-util = "0.3.31"
gstreamer = "0.24.4"
gstreamer-app = "0.24.4"
gstreamer-video = "0.24.4"
hex = "0.4.3"
iroh = { version = "1.0.3", default-features = false, features = ["tls-ring", "portmapper"] }
openmls = { git = "https://github.com/openmls/openmls.git", rev = "65396d8ed3121506d1b9c7d0e6ec9fce1bed486d", features = ["openmls_rust_crypto"] }
openmls_basic_credential = { git = "https://github.com/openmls/openmls.git", rev = "65396d8ed3121506d1b9c7d0e6ec9fce1bed486d" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls.git", rev = "65396d8ed3121506d1b9c7d0e6ec9fce1bed486d" }
qrcode = { version = "0.14.1", default-features = false }
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde", "formatting", "parsing"] }
tls_codec = "0.5.0"
tokio = { version = "1.48.0", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
# `deny` instead of `forbid` so the single audited GStreamer overlay call in
# pptalk-media can carry a local #[allow] with a safety justification.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
